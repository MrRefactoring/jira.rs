[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
jira = { path = "..", features = ["audit"] }
regex = "1.13"
reqwest = { version = "0.13", features = ["cookies", "json", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
