name: 🚀 Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ✅ Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v5
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      # A tag that does not match the manifest publishes a version nobody asked for, and crates.io cannot take it back.
      - name: 🏷️ The tag and the manifest agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"

          if [ "$tag" != "$manifest" ]; then
            echo "::error::the tag says $tag and Cargo.toml says $manifest"
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: 📐 Formatting
        run: cargo fmt --all --check
      - name: 🔍 Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: 🧪 Unit tests
        run: cargo test --all-features
      - name: 📦 Package
        run: cargo publish --dry-run --all-features

  publish:
    name: 🚀 crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: crates.io trades this token for a short-lived publish token, so no API token is stored
      # in this repository at all.
      id-token: write
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v5
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 🔑 Exchange the OIDC token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: 🚀 Publish
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
