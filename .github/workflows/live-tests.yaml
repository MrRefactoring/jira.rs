name: 🧩 Live tests

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: live-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: 🧩 Live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v7
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      - name: 🚀 Run the live suite
        run: cargo live
        env:
          JIRA_BASE_URL: ${{ secrets.HOST }}
          JIRA_EMAIL: ${{ secrets.EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.API_TOKEN }}
          JIRA_ORG_ID: ${{ secrets.JIRA_ORG_ID }}
          JIRA_ADMIN_API_KEY: ${{ secrets.JIRA_ADMIN_API_KEY }}
