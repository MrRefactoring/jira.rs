name: 🧱 Service Management Data Center tests

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

# Its own workflow rather than a job beside the Jira rig: a runner has memory for one Data Center instance, and
# starting the second takes the first down with it — without an error, since the kernel takes the container rather
# than the command.
concurrency:
  group: live-tests-jsm
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: 🧱 Service Management Data Center
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v5
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      # Atlassian publishes three-hour timebomb keys and a fresh container starts the three hours again, which is what
      # makes a rig per run workable. It lives in a secret rather than in the repository because a licence key is not
      # ours to redistribute. Use the Jira Service Desk Data Center key for both rigs: the published Jira Software one
      # is expired, and the Service Desk one licenses Assets and Service Desk together.
      - name: 🔑 Write the timebomb licence
        run: |
          printf '%s' "${{ secrets.JSM_DC_TIMEBOMB_LICENSE }}" > docker/jsm-dc/timebomb-license.txt
          test -s docker/jsm-dc/timebomb-license.txt
      - name: 🧱 Bring up Service Management Data Center
        run: cargo xtask jsm-dc up
      - name: 🚀 Run the Service Management suite
        run: cargo xtask coverage jsm
        env:
          JSM_SERVER_BASE_URL: http://localhost:8082
      - name: 🧹 Tear it down
        if: always()
        run: cargo xtask jsm-dc down
