name: 🧱 Data Center tests

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: live-tests-dc
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: 🧱 Data Center
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v7
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      # Atlassian publishes three-hour timebomb keys and a fresh container starts the three hours again, which is what
      # makes a rig per run workable. It lives in a secret rather than in the repository because a licence key is not
      # ours to redistribute. Use the Jira Service Desk Data Center key for both rigs: the published Jira Software one
      # is expired, and the Service Desk one licenses Assets and Service Desk together.
      - name: 🔑 Write the timebomb licence
        run: |
          printf '%s' "${{ secrets.JIRA_DC_TIMEBOMB_LICENSE }}" > docker/jira-dc/timebomb-license.txt
          test -s docker/jira-dc/timebomb-license.txt
      # A cold instance takes minutes to reach RUNNING, which is why the rig is a separate step rather than something
      # the suite does for itself.
      - name: 🧱 Bring up Jira Data Center
        run: cargo xtask jira-dc up
      - name: 🚀 Run the Data Center suite
        run: cargo xtask coverage server
        env:
          JIRA_SERVER_BASE_URL: http://localhost:8080
      - name: 🧹 Tear it down
        if: always()
        run: cargo xtask jira-dc down
