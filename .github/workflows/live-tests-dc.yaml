name: 🧱 Data Center tests

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: live-tests-dc
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: 🧱 Data Center
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v5
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      # Atlassian publishes three-hour timebomb licences for exactly this. A cold instance takes minutes to reach
      # RUNNING, which is why the rig is a separate step rather than something the suite does for itself.
      - name: 🧱 Bring up Jira Data Center
        run: cargo xtask jira-dc up
      - name: 🚀 Run the Data Center suite
        run: cargo live-server
        env:
          JIRA_SERVER_BASE_URL: http://localhost:8080
      - name: 🧹 Tear it down
        if: always()
        run: cargo xtask jira-dc down
