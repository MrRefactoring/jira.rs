name: 🧱 Data Center tests

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: live-tests-dc
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: 🧱 Data Center
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 🔄 Checkout sources
        uses: actions/checkout@v7
      - name: ⚙️ Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache the build
        uses: Swatinem/rust-cache@v2
      - name: 🔑 Write the timebomb licence
        env:
          TIMEBOMB_LICENSE: ${{ secrets.JIRA_DC_TIMEBOMB_LICENSE }}
        run: |
          printf '%s' "$TIMEBOMB_LICENSE" > docker/jira-dc/timebomb-license.txt
          test -s docker/jira-dc/timebomb-license.txt
      - name: 🧱 Bring up Jira Data Center
        run: cargo xtask jira-dc up
      - name: 🚀 Run the Data Center suite
        run: cargo xtask coverage server
        env:
          JIRA_SERVER_BASE_URL: http://localhost:8080
      - name: 🧹 Tear it down
        if: always()
        run: cargo xtask jira-dc down
