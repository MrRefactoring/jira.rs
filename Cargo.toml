[workspace]
members = [".", "xtask"]

[package]
name = "jira"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Modern Jira REST API client for Rust: Jira Cloud platform, Agile, Service Management, Assets and self-hosted Data Center APIs"
authors = ["Vladislav Tupikin <vladislav.tupikin@icloud.com>"]
license = "MIT"
repository = "https://github.com/MrRefactoring/jira.rs"
documentation = "https://docs.rs/jira"
readme = "README.md"
keywords = ["jira", "atlassian", "api", "client", "rest"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github/", "docker/", "tests/live/", "operations.json"]

[features]
default = ["cloud"]
audit = ["dep:serde_ignored"]
# Every `date-time` becomes an instant rather than the text it arrived as. Off by default: the type of a field then
# depends on a feature, which two crates depending on this one do not get to disagree about.
chrono = ["dep:chrono"]
coverage = []

# One feature per API surface, so a caller compiles the endpoints they use and not the ten thousand they do not.
admin = []
agile = []
assets = []
assets-server = []
cloud = []
server = []
service-desk = []
service-desk-server = []
teams = []
user-management = []
user-provisioning = []
webhooks = ["cloud", "agile", "dep:hmac", "dep:sha2"]

[lints.rust]
# The crate reaches the network and parses what comes back, and it does all of it in safe Rust. `forbid` rather than
# `deny` because there is no case where a generated file should be the one to make an exception.
unsafe_code = "forbid"

[dependencies]
bytes = "1.12"
chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "serde"] }
form_urlencoded = "1.2"
hmac = { version = "0.12", optional = true }
httpdate = "1.0"
reqwest = { version = "0.13", features = ["json", "multipart", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
serde_ignored = { version = "0.1", optional = true }
serde_path_to_error = "0.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "sync", "time"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
httpdate = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
wiremock = "0.6"

# The live suites are one binary rather than ninety-six, so the harness is compiled once instead of once per file.
[[test]]
name = "live"
path = "tests/live/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
