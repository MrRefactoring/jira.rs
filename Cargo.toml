[workspace]
members = [".", "xtask"]

[package]
name = "jira"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Modern Jira REST API client for Rust: Jira Cloud platform, Agile, Service Management, Assets and self-hosted Data Center APIs"
authors = ["Vladislav Tupikin <vladislav.tupikin@icloud.com>"]
license = "MIT"
repository = "https://github.com/MrRefactoring/jira.rs"
documentation = "https://docs.rs/jira"
readme = "README.md"
keywords = ["jira", "atlassian", "api", "client", "rest"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github/", "docker/", "tests/live/", "operations.json"]

[features]
default = ["cloud"]
audit = ["dep:serde_ignored"]
chrono = ["dep:chrono"]
coverage = []
tracing = ["dep:tracing"]

admin = []
agile = []
assets = []
assets-server = []
cloud = []
server = []
service-desk = []
service-desk-server = []
teams = []
user-management = []
user-provisioning = []
webhooks = ["cloud", "agile", "dep:hmac", "dep:sha2"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bytes = "1.12"
chrono = { version = "0.4.20", optional = true, default-features = false, features = ["std", "serde"] }
form_urlencoded = "1.2.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = { version = "0.13", optional = true }
httpdate = "1.0"
reqwest = { version = "0.13", features = ["json", "multipart", "form"] }
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.52"
sha2 = { version = "0.11", optional = true }
serde_ignored = { version = "0.1", optional = true }
serde_path_to_error = "0.1.2"
thiserror = "2.0.3"
tokio = { version = "1.53", features = ["fs", "sync", "time"] }
tracing = { version = "0.1.35", optional = true, default-features = false, features = ["std"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
httpdate = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
wiremock = "0.6"

[[test]]
name = "live"
path = "tests/live/main.rs"

[[example]]
name = "typed"
required-features = ["cloud", "agile"]

[[example]]
name = "preflight"
required-features = ["cloud", "agile", "service-desk"]

[package.metadata.docs.rs]
features = [
  "admin",
  "agile",
  "assets",
  "assets-server",
  "audit",
  "cloud",
  "server",
  "service-desk",
  "service-desk-server",
  "teams",
  "tracing",
  "user-management",
  "user-provisioning",
  "webhooks",
]
rustdoc-args = ["--cfg", "docsrs"]
